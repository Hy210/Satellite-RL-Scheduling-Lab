[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nsicps-rl-scheduling"
version = "0.1.0"
description = "Deterministic core for an RL satellite imaging scheduler prototype"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gymnasium>=1.3,<1.4",
    "fastapi>=0.115,<1",
    "numpy>=2.0,<3",
    "ortools>=9.14,<10",
    "pydantic>=2.13,<3",
    "sb3-contrib>=2.9,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.1,<3",
    "httpx>=0.28,<1",
    "psutil>=6.0,<7",
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.15,<0.16",
]

[tool.setuptools.packages.find]
include = ["backend*", "rl_core*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["backend", "rl_core"]
